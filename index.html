<!doctype html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Fear The Underdawgs Proyectos",
  "schemaVersion": 1,
  "description": "Plataforma personal de gestión de proyectos \"Fear the Underdawgs\". Secciones por proyecto (Tracewise, Raíz y los que agregues), con tareas que incluyen título, descripción breve y el paso que sigue después. Persiste en localStorage del dispositivo."
}
</script>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fear the Underdawgs</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f1f2f5;--panel:#fff;--ink:#15181d;--muted:#6b7280;--line:#e6e8ec;
    --radius:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.07);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --proj:#3b82f6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
  .wrap{max-width:100%;margin:0;padding:18px 24px 70px}
  #view{max-width:100%}
  .pv-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;margin-top:16px}
  @media(max-width:760px){ .pv-grid{grid-template-columns:1fr} }
  .pv-side{position:sticky;top:18px}
  @media(max-width:760px){ .pv-side{position:static} }
  input,textarea{width:100%;font-family:var(--font);font-size:14px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}
  input:focus,textarea:focus{border-color:#b6bac1}
  textarea{resize:vertical;min-height:42px}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
  .btn.proj{background:var(--proj)}
  .btn.ghost{background:#eceef1;color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .hidden{display:none!important}

  /* HOME */
  .home h1{margin:0 0 2px;font-size:24px;letter-spacing:-.02em}
  .home h1 .h1arrow{font-size:12px;font-weight:600;color:var(--muted);background:var(--accent-soft);border-radius:999px;padding:4px 10px;vertical-align:middle;margin-left:8px}
  .home h1:hover .h1arrow{background:#e2e5ea;color:var(--ink)}

  /* COMPANY VIEW */
  #company{max-width:1040px;margin:0 auto}
  .comp-head{background:#16181d;border-radius:var(--radius);padding:18px;color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
  .comp-head .back{border:none;background:rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;flex:0 0 auto}
  .comp-head .back:hover{background:rgba(255,255,255,.32)}
  .comp-head h2{margin:0;font-size:20px;letter-spacing:-.01em}
  .comp-head .cnt{font-size:12.5px;opacity:.85;margin-top:2px}
  .comp-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;margin-top:16px}
  @media(max-width:820px){ .comp-grid{grid-template-columns:1fr} }
  .ovcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .ov-stat{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
  .ov-stat b{display:block;font-size:21px;letter-spacing:-.02em}
  .ov-stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .ov-stat.big{grid-column:1 / -1;background:#111418;color:#fff}
  .ov-stat.big b{font-size:26px}
  .ov-stat.big span{color:#9aa0aa}
  .sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:20px 2px 8px}
  .brk-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .brk-row:last-child{border-bottom:none}
  .brk-row .bd{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .brk-row .bn{flex:1;font-size:13.5px}
  .brk-row .ba{font-weight:700;font-size:13.5px}
  .brk-row.clk{cursor:pointer;margin:0 -8px;padding:9px 8px;border-radius:9px}
  .brk-row.clk:hover{background:var(--accent-soft)}
  .brk-row .bgo{color:#bcc1c9;font-size:17px;margin-left:2px}
  .brk-row.clk:hover .bgo{color:var(--ink)}
  .concepts{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .concepts .ch{padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .con{border-bottom:1px solid var(--line)}
  .con:last-child{border-bottom:none}
  .con-h{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;font-weight:600;font-size:13.5px}
  .con-h .cc{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s}
  .con.open .con-h .cc{transform:rotate(180deg)}
  .con-b{padding:0 16px 14px;font-size:13px;color:#444a53;line-height:1.55}
  .home .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .15s;position:relative}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(16,24,40,.06),0 16px 38px rgba(16,24,40,.12)}
  .pcard .bar{height:8px;background:var(--c)}
  .pcard .inner{padding:16px}
  .pcard h3{margin:0;font-size:17px;display:flex;align-items:center;gap:9px}
  .pcard h3 .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .pcard .meta{color:var(--muted);font-size:13px;margin-top:8px}
  .pcard .pdel{position:absolute;top:12px;right:12px;border:none;background:rgba(0,0,0,.04);color:#9aa0a8;width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:13px;opacity:0;transition:.12s}
  .pcard:hover .pdel{opacity:1}
  .pcard .pdel:hover{background:rgba(0,0,0,.09);color:var(--ink)}
  .addcard{border:2px dashed #cfd3da;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;min-height:96px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
  .addcard:hover{border-color:#aab0ba;color:var(--ink)}
  .newproj-row{display:flex;gap:8px;margin-top:14px}

  /* NOTAS */
  #notes{max-width:1040px;margin:0 auto}
  .notes-screen{margin-top:16px}
  .proj-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .proj-header .sub{margin:0}
  .notes-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
  .notes-btn:hover{background:var(--accent-soft)}
  .notes-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .notes-add input{flex:1;min-width:200px}
  .notes-add select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;font-family:var(--font);color:var(--ink);cursor:pointer}
  .notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;border-top:4px solid var(--nc,#cfd3da);display:flex;flex-direction:column;gap:11px;min-height:92px}
  .note .ntext{font-size:13.5px;line-height:1.45;white-space:pre-wrap;flex:1}
  .note .nfoot{display:flex;align-items:center;gap:8px}
  .note .nchip{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;color:#fff;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .note .nchip.none{background:#e6e8ec;color:#6b7280}
  .note .ndate{font-size:11px;color:#9aa0a8;margin-left:auto;white-space:nowrap}
  .note .ndel{border:none;background:none;color:#bcc1c9;cursor:pointer;font-size:12px}
  .note .ndel:hover{color:var(--ink)}

  /* ===== DASHBOARD ===== */
  .dash{display:flex;gap:22px;align-items:flex-start}
  @media(max-width:820px){ .dash{flex-direction:column} }
  .side-nav{width:210px;flex:0 0 auto;background:#0f1115;color:#cfd2d8;border-radius:20px;padding:20px 14px;position:sticky;top:18px;min-height:calc(100vh - 40px);display:flex;flex-direction:column}
  @media(max-width:820px){ .side-nav{width:100%;position:static;min-height:0} }
  .sn-brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
  .sn-logo{font-size:22px;color:#4ade80}
  .sn-name b{display:block;font-size:14px;letter-spacing:.06em;color:#fff}
  .sn-name span{font-size:9px;letter-spacing:.18em;color:#7d828c}
  .nav-list{display:flex;flex-direction:column;gap:3px;flex:1}
  .nav-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-size:13.5px;font-weight:500;cursor:pointer;color:#cfd2d8;transition:background .12s}
  .nav-i .ni{width:18px;text-align:center;opacity:.75;font-size:13px}
  .nav-i:hover{background:#1a1d23;color:#fff}
  .nav-i.active{background:rgba(74,222,128,.14);color:#4ade80}
  .nav-i.active .ni{opacity:1}
  .nav-i.muted{opacity:.55}
  .nav-quote{font-size:11.5px;font-style:italic;color:#7d828c;padding:14px 8px 4px;line-height:1.5;border-top:1px solid rgba(255,255,255,.08);margin-top:10px}
  .fav{margin-top:12px}
  .fav-h{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6b7178;font-weight:600;padding:6px 10px}
  .fav-i{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:9px;font-size:13px;cursor:pointer;color:#a9adb5}
  .fav-i:hover{background:#1a1d23;color:#fff}
  .fav-i.on{color:#fff}
  .fav-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

  /* ===== PROJECT DASHBOARD (pv2) ===== */
  .pv2-top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .crumb{font-size:13px;color:var(--muted);white-space:nowrap}
  .crumb b{color:var(--ink)}
  .pv2-headrow{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
  .pv2-ic{width:92px;height:92px;border-radius:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;background:radial-gradient(circle at 38% 32%,color-mix(in srgb,var(--proj) 55%,#fff),var(--proj));box-shadow:0 10px 30px color-mix(in srgb,var(--proj) 35%,transparent)}
  .pv2-tt{flex:1;min-width:0}
  .pv2-tt h2{margin:0;font-size:30px;letter-spacing:-.02em}
  .pv2-meta{color:var(--muted);font-size:13.5px;margin-top:5px}
  .pv2-status{color:#1f9d57;font-weight:600}
  .pv2-tools{display:flex;gap:5px;margin-top:12px;align-items:center}
  .pv2-tools .sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;position:relative}
  .pv2-tools .sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent-soft)}
  .pv2-tools .sw.custom{display:flex;align-items:center;justify-content:center;background:#fff;font-size:11px;border:1px solid var(--line);overflow:hidden}
  .pv2-tools .sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0}
  .pv2-tools .pv-del{border:1px solid #f0d4d1;background:#fdeeec;color:var(--danger);height:26px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;margin-left:10px;padding:0 12px}
  .pv2-tools .pv-del:hover{background:#f8dcd8}
  .pv2-obj{width:270px;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;cursor:pointer}
  .pv2-obj:hover{border-color:#c9cdd4}
  .pv2-obj .oh{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
  .pv2-obj .ot{font-size:12.5px;color:#444a53;margin-top:6px;line-height:1.45}
  .pv2-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .pv2-tab{padding:10px 2px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .pv2-tab.on{color:var(--ink);border-bottom-color:var(--proj)}
  .pv2-tab:hover{color:var(--ink)}
  .stepper{display:flex;align-items:flex-start;margin-bottom:22px;overflow-x:auto}
  .step{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:120px;text-align:center}
  .step-c{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;color:#fff;font-size:14px}
  .step.done .step-c{background:var(--proj);border-color:var(--proj)}
  .step.cur .step-c{border-color:var(--proj);box-shadow:0 0 0 5px color-mix(in srgb,var(--proj) 18%,transparent)}
  .step.cur .step-c::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--proj)}
  .step-l{font-size:12.5px;margin-top:8px;font-weight:600}
  .step-s{font-size:11px;color:var(--muted);margin-top:2px}
  .step.done .step-l,.step.cur .step-l{color:var(--proj)}
  .step-line{flex:1;min-width:20px;height:2px;background:var(--line);margin:16px 6px 0}
  .step-line.on{background:var(--proj)}
  .pv2-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
  .kwrap{display:flex;flex-direction:column;min-width:0}
  .kstep{display:flex;align-items:center;height:32px}
  .kstep.spacer{visibility:hidden}
  .kstep .kline{flex:1;height:2px;background:var(--line)}
  .kstep .kline.hide{visibility:hidden}
  .kstep .kline.on{background:var(--proj)}
  .kstep .step-c{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:0 0 auto;margin:0 8px}
  .kwrap.done .step-c{background:var(--proj);border-color:var(--proj)}
  .kwrap.cur .step-c{border-color:var(--proj);box-shadow:0 0 0 5px color-mix(in srgb,var(--proj) 18%,transparent)}
  .kwrap.cur .step-c::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--proj)}
  .kstep-lb{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);height:16px;margin:6px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kwrap.cur .kstep-lb,.kwrap.done .kstep-lb{color:var(--proj)}
  .kcol{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column}
  .kcol-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14.5px;margin-bottom:8px}
  .kcol.cur .kname{color:var(--proj)}
  .kx{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
  .kx .phdel{border:none;background:none;color:#c4c8ce;cursor:pointer;font-size:12px}
  .kx .phdel:hover{color:var(--danger)}
  .kbar{height:5px;background:var(--accent-soft);border-radius:999px;overflow:hidden;margin-bottom:12px}
  .kbar span{display:block;height:100%;background:var(--proj);border-radius:999px}
  .ktasks{display:flex;flex-direction:column;gap:8px;flex:1}
  .krow{display:flex;align-items:center;gap:9px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .krow .kchk{width:18px;height:18px;border-radius:50%;border:2px solid #c8ccd2;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;cursor:pointer}
  .krow .kchk:hover{border-color:var(--proj)}
  .krow.done .kchk{background:var(--proj);border-color:var(--proj)}
  .krow .ktitle{flex:1;font-size:13px;cursor:pointer}
  .krow.done .ktitle{text-decoration:line-through;color:var(--muted)}
  .krow .ktools{display:flex;gap:1px;opacity:0}
  .krow:hover .ktools{opacity:1}
  .krow .ktools button{border:none;background:none;color:#aeb3bb;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:6px}
  .krow .ktools button:hover{background:var(--accent-soft);color:var(--ink)}
  .kadd{border:none;background:none;color:var(--proj);font-weight:600;font-size:13px;cursor:pointer;padding:11px 0 2px;text-align:center}
  .kadd:hover{opacity:.8}
  .kcol.full{background:linear-gradient(180deg,#fbfefc,#eef8f1);border-color:#cfe9db}
  .kdone{width:100%;margin-top:10px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;border-radius:10px;padding:10px;font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:.02em;box-shadow:0 6px 16px rgba(34,197,94,.3)}
  .kdone:hover{filter:brightness(1.05)}
  .finished{background:linear-gradient(180deg,#fbfefc,#edf8f1);border:1px solid #d3efdd;border-radius:16px;padding:18px;margin-bottom:22px}
  .finished h3{margin:0 0 12px;font-size:16px;color:#16a34a}
  .fin-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #dcefe3;font-size:13.5px}
  .fin-row:last-child{border-bottom:none}
  .fin-check{width:20px;height:20px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
  .fin-name{flex:1;font-weight:600}
  .fin-desc{font-weight:400;color:var(--muted);font-size:13px}
  .fin-cnt{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .kdesc{font-size:11.5px;color:var(--muted);font-style:italic;cursor:pointer;margin-bottom:10px;padding:2px 0;border-radius:6px}
  .kdesc:hover{color:var(--ink)}
  .kdesc-in{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;margin-bottom:10px;font-family:var(--font);outline:none}
  .kdesc-in:focus{border-color:var(--proj)}
  .obj-in{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;font-family:var(--font);resize:vertical;margin-top:6px;outline:none}
  .pv2-obj.open{cursor:default}
  .fin-restore{border:1px solid #cfe6d8;background:#fff;color:#16a34a;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .fin-restore:hover{background:#eef8f1}
  .kcol.kaddphase{justify-content:center;gap:8px;border:2px dashed #d4d8de;background:transparent;box-shadow:none}
  .kcol.kaddphase input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px}
  .pv2-bottom{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;margin-bottom:18px}
  @media(max-width:900px){ .pv2-bottom{grid-template-columns:1fr} }
  .pv2-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
  .pv2-card h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .pv2-card.up{background:linear-gradient(180deg,#fffdf9,#fff4e6);border-color:#f0e2ca}
  .pv2-card.up h3{color:#b9770f}
  .pv2-card.prog{background:linear-gradient(180deg,#f8fbff,#eaf2ff);border-color:#d6e4fb}
  .pv2-card.prog h3{color:#2563eb}
  .pv2-card.notes{background:linear-gradient(180deg,#fdfaff,#f4ecff);border-color:#e6d9fb}
  .pv2-card.notes h3{color:#7c3aed}
  .pv2-obj{background:linear-gradient(180deg,#fbfdfc,#eefaf2)!important;border-color:#d3efdd!important}
  .pv2-obj .oh{color:#1f9d57}
  #financeSection .logwrap{background:linear-gradient(180deg,#f9fefb,#e9f8f0);border-color:#d0eddb}
  #logSection .logwrap{background:linear-gradient(180deg,#fbfbfe,#eef0f7);border-color:#e0e3ee}
  .up-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .up-row:last-child{border-bottom:none}
  .up-row .kchk{width:18px;height:18px;border-radius:50%;border:2px solid #c8ccd2;flex:0 0 auto;cursor:pointer}
  .up-t{flex:1;font-size:13px}

  /* orbit */
  .orbit{position:relative;height:430px;margin:6px 0}
  .orbit-rings{position:absolute;inset:0;pointer-events:none}
  .orbit-rings::before,.orbit-rings::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px dashed #e2e5ea;border-radius:50%}
  .orbit-rings::before{width:74%;height:74%}
  .orbit-rings::after{width:46%;height:46%}
  .orbit-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,#eef1f6);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;color:#b6bac1;cursor:pointer;box-shadow:0 6px 18px rgba(16,24,40,.08)}
  .orbit-center:hover{color:var(--ink)}
  .orb{position:absolute;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff;text-align:center;
    background:radial-gradient(circle at 38% 32%, color-mix(in srgb,var(--oc) 55%,#fff), var(--oc));
    box-shadow:0 10px 30px color-mix(in srgb,var(--oc) 40%,transparent),inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .15s}
  .orb:hover{transform:translate(-50%,-50%) scale(1.06)}
  .orb-name{font-size:14px;font-weight:700;letter-spacing:-.01em;padding:0 8px;text-shadow:0 1px 2px rgba(0,0,0,.2)}

  /* PROJECT VIEW */

<script>
const KEY="ftu_data_v1";
const PALETTE=["#3b82f6","#8b5cf6","#ec4899","#ef4444","#f59e0b","#10b981","#14b8a6","#64748b"];
const PLATFORMS=["Instagram","Facebook","TikTok"];
let state=load(); migrate(); rollover();
let activeAdd=null;      // phase id with open add form
let draftTag="";         // tag for the task being created
let pickerOpen=false;    // today picker visible
function resetDraft(){ draftTag=""; }

function load(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){}
  return {projects:[{id:id(),name:"Tracewise"},{id:id(),name:"Raíz"}],current:null}; }
function migrate(){
  state.projects.forEach((p,i)=>{
    if(!p.color) p.color=PALETTE[i%PALETTE.length];
    if(!p.phases){
      if(p.tasks && p.tasks.length) p.phases=[{id:id(),name:"Fase 1",open:true,tasks:p.tasks}];
      else p.phases=[{id:id(),name:"Fase 1",open:true,tasks:[]}];
      delete p.tasks;
    }
    if(!p.log) p.log=[];
    if(!p.finance) p.finance=[];
    if(!p.archived) p.archived=[];
  });
  if(!state.today) state.today=[];
  if(!state.tomorrow) state.tomorrow=[];
  if(!state.todayDate) state.todayDate=null;
  if(!state.company) state.company={finance:[]};
  if(!state.company.finance) state.company.finance=[];
  if(!state.notes) state.notes=[];
  if(!state.todayLog) state.todayLog=[];
  save();
}
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function rollover(){
  const t=todayStr();
  if(state.todayDate!==t){
    if(!state.todayLog)state.todayLog=[];
    // lo que quedó sin terminar del día anterior se guarda en el historial
    (state.today||[]).forEach(it=>{ state.todayLog.push({id:id(),title:it.title,pid:it.pid||"",energy:it.energy||"",date:state.todayDate||t,done:false}); });
    // lo planeado para mañana pasa a ser hoy
    state.today=(state.tomorrow||[]).map(it=>({id:id(),title:it.title,tag:it.tag||"",pid:it.pid||"",srcTaskId:it.srcTaskId||"",next:it.next||"",energy:it.energy||"",done:false,pushed:false}));
    state.tomorrow=[];
    state.todayDate=t;
    save();
  }
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
function id(){ return Math.random().toString(36).slice(2,10); }
function curProj(){ return state.projects.find(p=>p.id===state.current); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function findTask(tid){ const p=curProj(); for(const ph of p.phases){ const t=ph.tasks.find(x=>x.id===tid); if(t) return {ph,t}; } return {}; }
function findGlobal(tid){ for(const p of state.projects){ for(const ph of p.phases){ const t=ph.tasks.find(x=>x.id===tid); if(t) return {p,ph,t}; } } return {}; }

/* ---- HOY / MAÑANA ---- */
let pendingTodayText="", todayChoosing=false;
function togglePicker(){ pickerOpen=!pickerOpen; renderToday(); }
function addTodayCustom(){ const i=document.getElementById("todayInput"); const v=i?i.value.trim():""; if(!v)return;
  if(!state.projects.length){ state.today.push({id:id(),title:v,tag:"",pid:"",srcTaskId:"",next:"",energy:todayEnergy,done:false,pushed:false}); save(); renderToday(); return; }
  pendingTodayText=v; todayChoosing=true; renderToday(); }
function chooseTodayProj(pid){ if(!pendingTodayText){todayChoosing=false;renderToday();return;}
  state.today.push({id:id(),title:pendingTodayText,tag:"",pid:pid||"",srcTaskId:"",next:"",energy:todayEnergy,done:false,pushed:false});
  pendingTodayText=""; todayChoosing=false; save(); renderToday(); }
function cancelTodayChoose(){ pendingTodayText=""; todayChoosing=false; renderToday(); }
function addTomorrowCustom(){ const i=document.getElementById("tomoInput"); const v=i.value.trim(); if(!v)return;
  state.tomorrow.push({id:id(),title:v,tag:"",srcTaskId:"",next:"",done:false}); save(); renderToday(); }
function pickTask(tid){ const {p,t}=findGlobal(tid); if(!t)return;
  state.today.push({id:id(),title:t.title,tag:t.tag||p.name,pid:p.id,srcTaskId:t.id,desc:t.desc||"",next:t.next||"",time:"",done:false,pushed:false}); pickerOpen=false; save(); renderToday(); }
function toggleTodayOpen(iid){ if(openItems.has(iid)) openItems.delete(iid); else openItems.add(iid); renderToday(); }
function toggleTodayItem(iid){ const it=state.today.find(x=>x.id===iid); if(!it)return;
  if(it.srcTaskId){ const {t}=findGlobal(it.srcTaskId); if(t) t.done=true; }
  if(it.next){ state.tomorrow.push({id:id(),title:it.next,tag:it.tag||"",srcTaskId:"",next:"",done:false}); }
  if(!state.todayLog)state.todayLog=[];
  state.todayLog.push({id:id(),title:it.title,pid:it.pid||"",energy:it.energy||"",date:todayStr(),done:true});
  state.today=state.today.filter(x=>x.id!==iid);
  save(); renderToday(); }
function delHistItem(hid){ state.todayLog=(state.todayLog||[]).filter(x=>x.id!==hid); save(); renderHist(); }
function delTodayItem(iid){ state.today=state.today.filter(x=>x.id!==iid); save(); renderToday(); }
function delTomorrowItem(iid){ state.tomorrow=state.tomorrow.filter(x=>x.id!==iid); save(); renderToday(); }
function tomorrowToToday(iid){ const i=state.tomorrow.findIndex(x=>x.id===iid); if(i<0)return;
  const it=state.tomorrow.splice(i,1)[0]; it.done=false; it.pushed=false; state.today.push(it); save(); renderToday(); }

const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
let openItems=new Set();

const ENERGIES=["#22c55e","#eab308","#ef4444"];
let todayEnergy="#22c55e";
function setEnergy(c){ todayEnergy=c; renderToday(); const i=document.getElementById("todayInput"); if(i)i.focus(); }
function renderToday(){
  const col=document.getElementById("hoyCard"); if(!col)return;
  const d=new Date();
  const doneToday=(state.todayLog||[]).filter(e=>e.date===todayStr()&&e.done).length;
  const totN=state.today.length+doneToday;
  const rows = state.today.length ? state.today.map(it=>{ const p=state.projects.find(x=>x.id===it.pid);
      const chip = p?'<span class="h2pchip" style="background:'+p.color+'">'+esc(p.name)+'</span>':'';
      return '<div class="h2item">'+
        '<span class="h2chk" onclick="toggleTodayItem(\''+it.id+'\')"></span>'+
        (it.energy?'<span class="h2en" style="background:'+it.energy+'"></span>':'')+
        '<div class="h2body"><div class="h2titrow"><span class="h2title">'+esc(it.title)+'</span>'+chip+'</div>'+
          (it.next?'<div class="h2next">→ '+esc(it.next)+'</div>':'')+'</div>'+
        '<button class="h2del" title="Quitar" onclick="delTodayItem(\''+it.id+'\')">✕</button></div>';
    }).join("") : '<div class="h2empty">Nada para hoy todavía. Escribe una tarea abajo.</div>';

  let add;
  if(todayChoosing){
    const chips='<span class="pchip-o" onclick="chooseTodayProj(\'\')">Sin proyecto</span>'+

function renderHist(){
  document.getElementById("home").classList.add("hidden");

  document.getElementById("notes").classList.add("hidden");

  const log=(state.todayLog||[]).slice();
  const byDate={};
  log.forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });
  const dates=Object.keys(byDate).sort((a,b)=>a<b?1:-1);
  let body="";
  if(!dates.length){ body='<div class="log-empty" style="padding:20px">Aún no hay historial. Lo que completes en Hoy aparecerá aquí.</div>'; }
  else dates.forEach(dt=>{
    const items=byDate[dt];
    // agrupar por proyecto
    const byProj={};
    items.forEach(e=>{ (byProj[e.pid||""]=byProj[e.pid||""]||[]).push(e); });
    let groups="";
    Object.keys(byProj).forEach(pid=>{
      const p=state.projects.find(x=>x.id===pid);

      groups+='<div class="hist-proj"><div class="hist-pn"><span class="pcd" style="background:'+pc+'"></span>'+esc(pname)+'</div>'+
        byProj[pid].map(e=>'<div class="hist-item"><span class="hist-chk '+(e.done?'done':'')+'">'+(e.done?'✓':'○')+'</span>'+
          (e.energy?'<span class="h2en" style="background:'+e.energy+'"></span>':'')+
          '<span class="hist-t '+(e.done?'':'undone')+'">'+esc(e.title)+'</span>'+
          '<button class="ldel" onclick="delHistItem(\''+e.id+'\')">✕</button></div>').join("")+'</div>';
    });
    body+='<div class="hist-day"><div class="hist-date">'+histDate(dt)+'</div>'+groups+'</div>';
  });

function histDate(dt){ const p=dt.split("-").map(Number); const d=new Date(p[0],p[1]-1,p[2]); const today=todayStr();
  const y=new Date(Date.now()-864e5); const yStr=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  if(dt===today) return "Hoy"; if(dt===yStr) return "Ayer";
  return cap(DIAS[d.getDay()])+", "+d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear(); }

function pickerHTML(){

const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(ms){ const d=new Date(ms); return d.getDate()+" "+MES[d.getMonth()]; }
function fmtLogDate(ms){ const d=new Date(ms); return d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear(); }
function isoToD(s){ const a=s.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function fmtISO(s){ const d=isoToD(s); return d.getDate()+" "+MES[d.getMonth()]; }
function fmtRange(start,end){
  if(start&&end){ const a=isoToD(start),b=isoToD(end);
    if(a.getMonth()===b.getMonth()) return a.getDate()+"–"+b.getDate()+" "+MES[b.getMonth()];
    return a.getDate()+" "+MES[a.getMonth()]+" – "+b.getDate()+" "+MES[b.getMonth()]; }
  if(start) return fmtISO(start);
  if(end) return fmtISO(end);
  return "";
}
function thisWeekISO(){ const d=new Date(); const day=d.getDay(); const diff=day===0?6:day-1;
  const mon=new Date(d); mon.setDate(d.getDate()-diff); const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  return {start:f(mon),end:f(sun)}; }
function setThisWeek(){ const w=thisWeekISO(); document.getElementById("tStart").value=w.start; document.getElementById("tEnd").value=w.end; }
function setEditWeek(tid){ const w=thisWeekISO(); document.getElementById("e_s_"+tid).value=w.start; document.getElementById("e_e_"+tid).value=w.end; }

      '<div class="fsum"><div class="fs"><b>'+money(total)+'</b><span>Total</span></div>'+
      '<div class="fs"><b>'+money(thisMonth)+'</b><span>Este mes</span></div></div>'+

function projStats(p){ let done=0,total=0; p.phases.forEach(ph=>ph.tasks.forEach(t=>{total++; if(t.done)done++;})); return {done,total,pct: total?Math.round(done/total*100):0}; }
function lastActivity(p){ let m=0; p.phases.forEach(ph=>ph.tasks.forEach(t=>{ if((t.created||0)>m)m=t.created; }));
  (p.log||[]).forEach(e=>{if(e.created>m)m=e.created;}); (p.finance||[]).forEach(e=>{if(e.created>m)m=e.created;});
  (state.notes||[]).forEach(n=>{if(n.pid===p.id&&n.created>m)m=n.created;}); return m; }
function daysSince(ms){ if(!ms)return 9999; return Math.floor((Date.now()-ms)/864e5); }
function relTime(ms){ const s=(Date.now()-ms)/1000; if(s<3600)return "Hace "+Math.max(1,Math.floor(s/60))+" min"; if(s<86400)return "Hace "+Math.floor(s/3600)+" h"; const d=Math.floor(s/86400); return d===1?"Ayer":"Hace "+d+" días"; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function renderActivity(){
  const el=document.getElementById("activityCard"); if(!el)return;
  const days=22; const t0=new Date(); t0.setHours(0,0,0,0);
  const b=new Array(days).fill(0);
  const bump=ms=>{ if(!ms)return; const d=new Date(ms); d.setHours(0,0,0,0); const diff=Math.floor((t0-d)/864e5); if(diff>=0&&diff<days)b[days-1-diff]++; };
  state.projects.forEach(p=>{ p.phases.forEach(ph=>ph.tasks.forEach(t=>bump(t.created))); (p.log||[]).forEach(e=>bump(e.created)); (p.finance||[]).forEach(e=>bump(e.created)); });
  (state.company.finance||[]).forEach(e=>bump(e.created)); (state.notes||[]).forEach(n=>bump(n.created));
  const max=Math.max(1,...b);
  const cells=b.map(v=>{ const lvl=v===0?0:Math.min(4,Math.ceil(v/max*4)); return '<span class="hm l'+lvl+'"></span>'; }).join("");
  const rows=state.projects.slice().sort((a,c)=>lastActivity(c)-lastActivity(a)).map(p=>{ const la=lastActivity(p),ds=daysSince(la);
    return '<div class="act-row"><span class="act-dot" style="background:'+p.color+'"></span><span class="act-n">'+esc(p.name)+'</span>'+
      '<span class="act-t">'+(la? (ds===0?'Hoy':(ds>900?'—':'Hace '+ds+' días')):'—')+'</span></div>'; }).join("");
  el.innerHTML='<div class="hm-grid">'+cells+'</div><div class="act-rows">'+rows+'</div>';
}

function sparkline(vals,color){
  const w=100,h=34; const max=Math.max(...vals,1), min=Math.min(...vals,0); const rng=(max-min)||1;
  const pts=vals.map((v,i)=>{ const x=vals.length>1? i/(vals.length-1)*w : w/2; const y=h-2-((v-min)/rng)*(h-6); return x.toFixed(1)+','+y.toFixed(1); });
  const line=pts.join(' ');
  const fx=pts[0].split(',')[0], lx=pts[pts.length-1].split(',')[0];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polygon points="'+fx+','+h+' '+line+' '+lx+','+h+'" fill="'+color+'" opacity="0.13"/>'+
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function finCol(label,val,series,color){ return '<div class="f3"><span>'+label+'</span><b>'+val+'</b>'+sparkline(series,color)+'</div>'; }
function renderFinDash(){
  const el=document.getElementById("dashFin"); if(!el)return;
  let projTotal=0; state.projects.forEach(p=>(p.finance||[]).forEach(e=>projTotal+=e.amount));
  const compTotal=(state.company.finance||[]).reduce((s,e)=>s+e.amount,0);
  const now=new Date();
  const mk=()=>{const a=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);a.push({y:d.getFullYear(),m:d.getMonth(),v:0});}return a;};
  const mTotal=mk(), mComp=mk(), mProj=mk();
  const addTo=(arr,e)=>{const d=new Date(e.created);const b=arr.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(b)b.v+=e.amount;};
  (state.company.finance||[]).forEach(e=>{addTo(mComp,e);addTo(mTotal,e);});
  state.projects.forEach(p=>(p.finance||[]).forEach(e=>{addTo(mProj,e);addTo(mTotal,e);}));
  const cum=arr=>{let s=0;return arr.map(x=>s+=x.v);};
  el.innerHTML='<div class="fin3">'+
    finCol('Total', money(projTotal+compTotal), cum(mTotal), '#1f9d57')+
    finCol('Herramientas', money(compTotal), cum(mComp), '#64748b')+
    finCol('Proyectos', money(projTotal), cum(mProj), '#3b82f6')+
    '</div>'+
    '<button class="fin-pill" onclick="openCompany()"><span class="fp-ic">₣</span> Revisar finanzas de la empresa <span class="fp-go">›</span></button>';
}

        '<button class="h2del" style="color:#c4c8ce" onclick="deleteArchived(\''+ph.id+'\')" title="Borrar">✕</button></div>').join("")+'</div>';
  }

  document.getElementById("viewMain").innerHTML=html+cols+finished+bottom+finrow;
  renderFinance();
  renderLog();
}

function addFormHTML(){
  return '<div class="addform">'+
    '<input id="tTitle" placeholder="¿Qué vas a hacer?" onkeydown="if(event.key===\'Enter\')addTask()">'+
    '<div class="actions"><button class="btn ghost" onclick="closeAdd()">Cancelar</button>'+
    '<button class="btn proj" onclick="addTask()">Agregar</button></div></div>';
}

function taskHTML(t){
  if(t._edit){
    return '<div class="editbox">'+
      '<input id="e_t_'+t.id+'" value="'+esc(t.title)+'">'+
      '<textarea id="e_d_'+t.id+'" placeholder="Descripción">'+esc(t.desc)+'</textarea>'+
      '<input id="e_n_'+t.id+'" value="'+esc(t.next)+'" placeholder="Qué sigue después">'+
      '<div class="daterow"><input type="date" id="e_s_'+t.id+'" value="'+(t.start||"")+'"><span>a</span>'+
        '<input type="date" id="e_e_'+t.id+'" value="'+(t.end||"")+'">'+
        '<button class="wk" onclick="setEditWeek(\''+t.id+'\')">Esta semana</button></div>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end">'+
        '<button class="btn ghost" onclick="cancelEdit(\''+t.id+'\')">Cancelar</button>'+
        '<button class="btn proj" onclick="saveEdit(\''+t.id+'\')">Guardar</button></div></div>';
  }
  return '<div class="task '+(t.done?'done':'')+'">'+
    '<div class="check" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'✓':'')+'</div>'+
    '<div class="body"><div class="toprow">'+
      '<span class="ttitle">'+esc(t.title)+'</span>'+
      (t.tag?'<span class="tag">'+esc(t.tag)+'</span>':'')+
      '<span class="date">'+(fmtRange(t.start,t.end)||fmtDate(t.created||Date.now()))+'</span></div>'+
      (t.desc?'<div class="desc">'+esc(t.desc)+'</div>':'')+
      (t.next?'<div class="next"><b>Después →</b> '+esc(t.next)+'</div>':'')+
    '</div><div class="tools">'+
      '<button title="Editar" onclick="editTask(\''+t.id+'\')">✎</button>'+
      '<button title="Eliminar" onclick="deleteTask(\''+t.id+'\')">🗑</button></div></div>';
}

/* ---- VISTA DE EMPRESA ---- */
let openConcepts=new Set();
const CONCEPTS=[
  {t:"Inversión vs. gasto",d:"No todo lo que sale es lo mismo. <b>Inversión</b> = dinero que esperas que regrese multiplicado (pauta, una herramienta que te hace producir más). <b>Gasto</b> = el costo de operar (una suscripción que solo mantiene la luz encendida). Separarlos te dice si estás construyendo o solo sobreviviendo."},
  {t:"ROI (retorno de inversión)",d:"Por cada $1 que metes, ¿cuánto regresa? <b>ROI = (ganancia − inversión) ÷ inversión</b>. Si metes $150 en ads y generas $450, tu ROI es 200%. Es tu brújula para saber qué campañas repetir y cuáles cortar."},
  {t:"Costos fijos vs. variables",d:"<b>Fijos</b>: se pagan salgas o no (herramientas y suscripciones de Fear the Underdawgs). <b>Variables</b>: suben según tu actividad (pauta por campaña). Conocer tus fijos te dice cuánto necesitas generar cada mes solo para no perder."},
  {t:"Punto de equilibrio",d:"El punto donde tus ingresos cubren <b>exactamente</b> tus costos: ni ganas ni pierdes. Si tus herramientas cuestan $800/mes, ese es el mínimo que debes generar antes de hablar de ganancia. Tener el número te pone una meta clara."},
  {t:"Flujo de caja (cash flow)",d:"El dinero que entra y sale mes a mes. Puedes ser rentable en papel y aun así quedarte sin efectivo si pagas las herramientas antes de cobrar. Vigila el <b>ritmo</b>, no solo el total."},
  {t:"Fondo de reinversión",d:"Aparta un % fijo de cada ingreso (ej. 20%) solo para reinvertir en ads y herramientas. Así el crecimiento se financia solo y no sale de tu bolsillo. Ojo: es distinto a un <b>fondo de inversión</b> de mercados (donde pones dinero en instrumentos financieros para que rinda con el tiempo); aquí el 'fondo' es el motor interno de tu empresa."},
  {t:"CAC (costo de adquirir un cliente)",d:"Cuánto te cuesta conseguir un cliente que convierte. Si $150 de ads te traen 3 clientes, tu <b>CAC = $50</b>. Bájalo mejorando el contenido y la segmentación, no solo subiendo el presupuesto."},
  {t:"Margen de ganancia",d:"De cada peso que entra, cuánto te queda después de costos. Margen alto = negocio sano. Lo subes cobrando mejor o produciendo más barato (batching, reutilizar un video en varios formatos)."}
];
function toggleConcept(i){ const k=String(i); if(openConcepts.has(k))openConcepts.delete(k); else openConcepts.add(k); renderCompany(); }
function addCompanyExpense(){ const a=parseFloat(document.getElementById("compAmount").value); if(!a||a<=0)return;
  const c=document.getElementById("compConcept").value.trim();
  state.company.finance.unshift({id:id(),amount:a,concept:c,created:Date.now()}); save(); renderCompany(); }
function delCompanyExpense(eid){ state.company.finance=state.company.finance.filter(x=>x.id!==eid); save(); renderCompany(); }
function openCompany(){ renderCompany(); }

function renderCompany(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("view").classList.add("hidden");
  document.getElementById("notes").classList.add("hidden");
  document.getElementById("hist").classList.add("hidden");
  const el=document.getElementById("company"); el.classList.remove("hidden");
  const now=new Date();
  let projTotal=0, projMonth=0;
  const brk=state.projects.map(p=>{ const t=(p.finance||[]).reduce((s,e)=>s+e.amount,0); projTotal+=t;
    (p.finance||[]).forEach(e=>{const d=new Date(e.created); if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())projMonth+=e.amount;});
    return {id:p.id,name:p.name,color:p.color,total:t}; });
  const comp=state.company.finance;
  const compTotal=comp.reduce((s,e)=>s+e.amount,0);
  let compMonth=0; comp.forEach(e=>{const d=new Date(e.created); if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())compMonth+=e.amount;});
  const grand=projTotal+compTotal, grandMonth=projMonth+compMonth;

  const months=[]; for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),sum:0});}
  const allExp=comp.concat(...state.projects.map(p=>p.finance||[]));
  allExp.forEach(e=>{const d=new Date(e.created);const b=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(b)b.sum+=e.amount;});
  const max=Math.max(1,...months.map(x=>x.sum));
  const chart=months.map(x=>'<div class="fbar-col"><div class="fbar-track"><div class="fbar" style="height:'+(x.sum/max*100)+'%;background:#111418"></div></div><div class="fbar-lb">'+MES[x.m]+'</div></div>').join("");

  // breakdown proyectos + empresa
  let brkRows=brk.map(b=>'<div class="brk-row clk" onclick="openProject(\''+b.id+'\')" title="Abrir '+esc(b.name)+'"><span class="bd" style="background:'+b.color+'"></span><span class="bn">'+esc(b.name)+'</span><span class="ba">'+money(b.total)+'</span><span class="bgo">›</span></div>').join("");
  brkRows+='<div class="brk-row"><span class="bd" style="background:#111418"></span><span class="bn">Herramientas / empresa</span><span class="ba">'+money(compTotal)+'</span></div>';

  // ledger empresa
  const ledger=comp.length
    ? comp.map(e=>'<div class="fx"><div class="fxcol"><div class="fxc">'+esc(e.concept||"Gasto")+'</div>'+
        '<div class="fxd">🗓 '+fmtLogDate(e.created)+'</div></div><div class="fxa" style="color:#111418">'+money(e.amount)+'</div>'+
        '<button class="ldel" title="Borrar" onclick="delCompanyExpense(\''+e.id+'\')">✕</button></div>').join("")
    : '<div class="log-empty">Sin gastos de empresa aún. Ej.: monto $299, concepto “Canva Pro”.</div>';

  const concepts=CONCEPTS.map((c,i)=>{
    const o=openConcepts.has(String(i));
    return '<div class="con '+(o?'open':'')+'"><div class="con-h" onclick="toggleConcept('+i+')">'+esc(c.t)+'<span class="cc">▼</span></div>'+
      (o?'<div class="con-b">'+c.d+'</div>':'')+'</div>';
  }).join("");

  el.innerHTML=
    '<div class="comp-head"><button class="back" onclick="goHome()" title="Volver">←</button>'+
      '<div><h2>Fear the Underdawgs</h2><div class="cnt">Visión de empresa · finanzas consolidadas</div></div></div>'+
    '<div class="comp-grid">'+
      '<div>'+
        '<div class="ovcard">'+
          '<div class="ov-grid">'+
            '<div class="ov-stat big"><b>'+money(grand)+'</b><span>Inversión total de la empresa</span></div>'+
            '<div class="ov-stat"><b>'+money(grandMonth)+'</b><span>Este mes</span></div>'+
            '<div class="ov-stat"><b>'+money(projTotal)+'</b><span>En proyectos</span></div>'+
            '<div class="ov-stat"><b>'+money(compTotal)+'</b><span>En herramientas</span></div>'+
          '</div>'+
          '<div class="fchart">'+chart+'</div>'+
          '<div class="sec-h" style="margin-top:4px">Desglose por área</div>'+brkRows+
        '</div>'+
        '<div class="sec-h">Gastos de empresa (herramientas, suscripciones)</div>'+
        '<div class="logwrap fin"><div class="log-body">'+
          '<div class="fadd"><input id="compAmount" class="amt" type="number" min="0" placeholder="$ monto" onkeydown="if(event.key===\'Enter\')addCompanyExpense()">'+
          '<input id="compConcept" class="cpt" placeholder="Concepto (ej. Canva Pro)" onkeydown="if(event.key===\'Enter\')addCompanyExpense()">'+
          '<button class="btn" onclick="addCompanyExpense()">Anotar</button></div>'+ledger+'</div></div>'+
      '</div>'+
      '<div><div class="concepts"><div class="ch">📚 Conceptos financieros</div>'+concepts+'</div></div>'+
    '</div>';
}


if(state.current && curProj()) renderView(); else renderHome();
</script>
